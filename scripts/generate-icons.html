<!DOCTYPE html>
<html>
<head><title>Generate PWA Icons</title></head>
<body style="font-family: monospace; padding: 2rem; background: #1a1613; color: #f0ebe1;">
  <h1>PWA Icon Generator</h1>
  <p>Click each button to download the icon at that size.</p>
  <div id="previews" style="display: flex; gap: 2rem; align-items: end; margin: 2rem 0;"></div>
  <script>
    const sizes = [192, 512];
    const svgSource = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="96" fill="#0c0a09"/>
      <g fill="#f59e0b">
        <rect x="80" y="380" width="352" height="48" rx="8"/>
        <rect x="120" y="308" width="272" height="48" rx="8"/>
        <rect x="160" y="236" width="192" height="48" rx="8"/>
        <rect x="200" y="164" width="112" height="48" rx="8"/>
      </g>
      <circle cx="256" cy="124" r="16" fill="#fbbf24" opacity="0.8"/>
      <circle cx="256" cy="256" r="200" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.1"/>
    </svg>`;

    const container = document.getElementById('previews');

    sizes.forEach(size => {
      const div = document.createElement('div');
      div.style.textAlign = 'center';

      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      canvas.style.border = '1px solid #453d36';
      canvas.style.borderRadius = '12px';
      canvas.style.width = Math.min(size, 256) + 'px';
      canvas.style.height = Math.min(size, 256) + 'px';

      const ctx = canvas.getContext('2d');
      const img = new Image();
      const blob = new Blob([svgSource], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);

      img.onload = () => {
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);

        const btn = document.createElement('button');
        btn.textContent = `Download pwa-${size}x${size}.png`;
        btn.style.cssText = 'margin-top:1rem; padding:0.5rem 1rem; background:#f59e0b; color:#0c0a09; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-family:monospace;';
        btn.onclick = () => {
          const a = document.createElement('a');
          a.download = `pwa-${size}x${size}.png`;
          a.href = canvas.toDataURL('image/png');
          a.click();
        };
        div.appendChild(btn);
      };
      img.src = url;

      const label = document.createElement('div');
      label.textContent = `${size}x${size}`;
      label.style.marginBottom = '0.5rem';
      label.style.color = '#a6997f';

      div.appendChild(label);
      div.appendChild(canvas);
      container.appendChild(div);
    });
  </script>
</body>
</html>
